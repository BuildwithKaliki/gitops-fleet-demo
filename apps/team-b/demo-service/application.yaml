# team-b's demo-service - same chart, different values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-b-demo-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BuildwithKaliki/gitops-fleet-demo.git
    targetRevision: main
    path: resources/chart
    helm:
      valueFiles:
        - ../../apps/team-b/demo-service/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: team-b
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
