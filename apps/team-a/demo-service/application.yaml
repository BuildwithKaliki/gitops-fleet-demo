# team-a's demo-service - the ONLY file a team edits to ship.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-a-demo-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BuildwithKaliki/gitops-fleet-demo.git
    targetRevision: main
    path: resources/chart
    helm:
      valueFiles:
        - ../../apps/team-a/demo-service/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: team-a
  syncPolicy:
    automated:
      prune: true
      selfHeal: true          # <- the drift-revert guarantee
    syncOptions:
      - CreateNamespace=true
