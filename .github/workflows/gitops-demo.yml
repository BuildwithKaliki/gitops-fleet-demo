# Full GitOps proof in CI - free runner, no AWS needed.
name: gitops-demo

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prove-gitops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create cluster + install ArgoCD + apply root app
        run: |
          k3d cluster create gitops-demo --wait
          kubectl create namespace argocd
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl -n argocd rollout status deploy/argocd-server --timeout=180s
          kubectl apply -f bootstrap/root.yaml

      - name: Wait for fleet to converge (apps Healthy)
        run: |
          for i in $(seq 1 60); do
            HEALTHY=$(kubectl -n argocd get applications -o json | jq '[.items[] | select(.status.health.status=="Healthy")] | length')
            TOTAL=$(kubectl -n argocd get applications -o json | jq '.items | length')
            echo "attempt $i: $HEALTHY/$TOTAL healthy"
            if [ "$HEALTHY" -ge 2 ] && [ "$TOTAL" -ge 2 ]; then
              echo "FLEET HEALTHY"
              exit 0
            fi
            sleep 10
          done
          echo "fleet never became healthy"
          kubectl -n argocd get applications -o wide
          exit 1

      - name: Prove drift-revert (the GitOps promise)
        run: |
          DESIRED=$(grep -oP '^replicaCount: \K[0-9]+' apps/team-a/demo-service/values.yaml)
          DEPLOY=$(kubectl -n team-a get deploy -o name | head -1 | cut -d/ -f2)
          echo "desired (from Git): $DESIRED"
          kubectl -n team-a scale deploy/$DEPLOY --replicas=$((DESIRED + 5))
          sleep 30
          for i in $(seq 1 12); do
            CURRENT=$(kubectl -n team-a get deploy/$DEPLOY -o jsonpath='{.spec.replicas}')
            echo "attempt $i replicas=$CURRENT"
            if [ "$CURRENT" -eq "$DESIRED" ]; then
              echo "DRIFT REVERTED - ArgoCD restored $DESIRED replicas from Git"
              exit 0
            fi
            sleep 10
          done
          echo "drift not reverted in time"
          exit 1

      - name: Teardown
        if: always()
        run: k3d cluster delete gitops-demo || true
